<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pintaru — Belajar SMA, UTBK &amp; TKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF0EA;
  --surface: #FFFFFF;
  --ink: #1B2A41;
  --ink-soft: #56637A;
  --ink-faint: #8A93A6;
  --line: #DCDFD4;
  --navy: #1B2A41;
  --navy-soft: #2A3E5C;
  --accent: #E4572E;
  --accent-soft: #FBE2D9;
  --ipa: #147D6F;
  --ipa-soft: #DCEFEA;
  --ips: #B9860F;
  --ips-soft: #F4E9D2;
  --bahasa: #7A3E92;
  --bahasa-soft: #EDE1F2;
  --good: #1E8A5B;
  --good-soft: #DEF2E7;
  --bad: #C43D3D;
  --bad-soft: #FAE1DF;
  --radius-card: 14px;
  --radius-btn: 10px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(27,42,65,0.06), 0 1px 0 rgba(27,42,65,0.04);
  --shadow-2: 0 8px 24px rgba(27,42,65,0.10);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .display {
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
  margin: 0;
}

a { color: inherit; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--accent-soft); }

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy);
  color: #fff;
  padding: 0 20px;
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 28px;
  height: 60px;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; font-family: "Space Grotesk", sans-serif; white-space: nowrap; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.topnav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
.topnav-btn {
  background: transparent; border: none; color: rgba(255,255,255,0.68);
  font-size: 14.5px; font-weight: 500; padding: 10px 12px; border-radius: var(--radius-btn);
  white-space: nowrap; transition: background 0.15s, color 0.15s;
}
.topnav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
.topnav-btn.active { background: rgba(255,255,255,0.14); color: #fff; }

/* ---------- Layout ---------- */
.container { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; width: 100%; flex: 1; }
.container.narrow { max-width: 760px; }

/* ---------- Breadcrumb / back ---------- */
.crumbrow { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft);
  padding: 7px 12px 7px 9px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 500;
}
.back-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
.crumb-text { color: var(--ink-faint); font-size: 13.5px; }
.crumb-text b { color: var(--ink-soft); font-weight: 600; }

/* ---------- Hero (Beranda) ---------- */
.hero {
  background: var(--navy);
  color: #fff;
  border-radius: 20px;
  padding: 40px 36px;
  position: relative;
  overflow: hidden;
  margin-bottom: 28px;
}
.hero::after {
  content: "";
  position: absolute; right: -60px; top: -60px; width: 260px; height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(228,87,46,0.35), transparent 70%);
}
.hero-eyebrow { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 10px; position: relative; }
.hero h1 { font-size: 32px; line-height: 1.15; max-width: 560px; position: relative; }
.hero p { color: rgba(255,255,255,0.72); max-width: 480px; margin-top: 12px; font-size: 15px; position: relative; }
.hero-actions { display: flex; gap: 10px; margin-top: 22px; position: relative; flex-wrap: wrap; }

.stat-strip { display: flex; gap: 0; margin-top: 28px; position: relative; border-top: 1px solid rgba(255,255,255,0.14); padding-top: 20px; flex-wrap: wrap; }
.stat-item { padding-right: 32px; margin-right: 32px; border-right: 1px solid rgba(255,255,255,0.14); }
.stat-item:last-child { border-right: none; }
.stat-num { font-family: "Space Grotesk", sans-serif; font-size: 24px; font-weight: 700; }
.stat-label { font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 2px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border-radius: var(--radius-btn); font-weight: 600; font-size: 14px;
  padding: 10px 18px; border: none; transition: transform 0.1s, background 0.15s, box-shadow .15s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #cf4a24; }
.btn-ghost { background: rgba(255,255,255,0.12); color: #fff; }
.btn-ghost:hover { background: rgba(255,255,255,0.2); }
.btn-outline { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn-outline:hover { border-color: var(--ink-faint); }
.btn-block { width: 100%; justify-content: center; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* ---------- Chips (selectors: kelas / jurusan) ---------- */
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft);
  padding: 9px 16px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 600;
}
.chip:hover { border-color: var(--ink-faint); color: var(--ink); }
.chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 14px; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 19px; }
.section-head .hint { color: var(--ink-faint); font-size: 13.5px; }

/* ---------- Subject grid ---------- */
.subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.subject-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
  padding: 18px; text-align: left; display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-1); transition: box-shadow .15s, transform .15s;
}
.subject-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
.subject-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.subject-card h3 { font-size: 16px; }
.subject-card .meta { color: var(--ink-faint); font-size: 13px; }
.tag-ipa { color: var(--ipa); background: var(--ipa-soft); }
.tag-ips { color: var(--ips); background: var(--ips-soft); }
.tag-bahasa { color: var(--bahasa); background: var(--bahasa-soft); }

/* ---------- Chapter list ---------- */
.chapter-list { display: flex; flex-direction: column; gap: 10px; }
.chapter-row {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card);
  padding: 15px 18px; text-align: left; box-shadow: var(--shadow-1);
}
.chapter-row:hover { border-color: var(--ink-faint); }
.chapter-num {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13.5px; font-family: "Space Grotesk", sans-serif;
}
.chapter-row .body { flex: 1; min-width: 0; }
.chapter-row h4 { font-size: 15px; font-weight: 600; }
.chapter-row .sub { color: var(--ink-faint); font-size: 12.5px; margin-top: 2px; }
.chapter-score { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); flex-shrink: 0; }

/* ---------- Chapter detail ---------- */
.detail-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow-1); }
.detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.detail-tag { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 4px 11px; border-radius: var(--radius-pill); margin-bottom: 10px; }
.detail-card h1 { font-size: 24px; line-height: 1.25; }
.materi-block p { margin: 0 0 12px; max-width: 68ch; color: var(--ink); }
.materi-block p:last-child { margin-bottom: 0; }

.method-box {
  margin-top: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
}
.method-box h3 { font-size: 14.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.method-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.method-steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.method-steps .num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}

.divider { height: 1px; background: var(--line); margin: 24px 0; }

/* ---------- Quiz ---------- */
.quiz-progress { display: flex; gap: 6px; margin-bottom: 18px; }
.quiz-dot { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.quiz-dot.done { background: var(--accent); }
.quiz-dot.current { background: var(--navy-soft); }

.quiz-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow-1); }
.quiz-meta { color: var(--ink-faint); font-size: 13px; margin-bottom: 8px; }
.quiz-question { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-option {
  display: flex; align-items: center; gap: 12px; text-align: left;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 16px; background: var(--surface);
  font-size: 14.5px; color: var(--ink);
}
.quiz-option:hover { border-color: var(--ink-faint); }
.quiz-option.selected { border-color: var(--navy); background: #F1F3F8; }
.opt-letter {
  width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; flex-shrink: 0; color: var(--ink-soft);
}
.quiz-option.selected .opt-letter { background: var(--navy); border-color: var(--navy); color: #fff; }

.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }

/* ---------- Result ---------- */
.result-hero { display: flex; align-items: center; gap: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 28px; box-shadow: var(--shadow-1); margin-bottom: 22px; flex-wrap: wrap; }
.score-ring {
  width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 20px; color: #fff;
}
.result-copy h2 { font-size: 19px; margin-bottom: 4px; }
.result-copy p { color: var(--ink-soft); font-size: 14px; margin: 0; }

.review-item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 10px; }
.review-q { font-weight: 600; font-size: 14.5px; margin-bottom: 10px; }
.review-line { display: flex; gap: 8px; font-size: 13.5px; margin-bottom: 4px; align-items: flex-start; }
.review-line .lab { flex-shrink: 0; width: 86px; color: var(--ink-faint); }
.review-good { color: var(--good); font-weight: 600; }
.review-bad { color: var(--bad); font-weight: 600; }
.review-exp { margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13.5px; color: var(--ink-soft); }

/* ---------- Badges ---------- */
.badge { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); }
.badge-good { background: var(--good-soft); color: var(--good); }
.badge-todo { background: var(--paper); color: var(--ink-faint); border: 1px solid var(--line); }

/* ---------- Placeholder chapters ---------- */
.chapter-row.placeholder { opacity: 0.62; cursor: default; }
.chapter-row.placeholder:hover { border-color: var(--line); }

/* ---------- UTBK ---------- */
.utbk-banner {
  background: linear-gradient(135deg, var(--navy) 0%, #16304F 100%);
  color: #fff; border-radius: 18px; padding: 30px 32px; margin-bottom: 20px; position: relative; overflow: hidden;
}
.utbk-banner h1 { font-size: 24px; max-width: 520px; }
.utbk-banner p { color: rgba(255,255,255,0.75); margin-top: 10px; max-width: 560px; font-size: 14.5px; }
.info-note {
  background: var(--accent-soft); border: 1px solid #F3C5AE; color: #8C3413;
  border-radius: 12px; padding: 14px 16px; font-size: 13.5px; margin-top: 18px; line-height: 1.5;
}
.utbk-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 12px; }
.utbk-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 20px; box-shadow: var(--shadow-1); text-align: left; }
.utbk-card h3 { font-size: 16px; margin-bottom: 8px; }
.utbk-card p { color: var(--ink-faint); font-size: 13px; margin: 0 0 14px; }

/* ---------- Empty / loading ---------- */
.empty-state { text-align: center; padding: 60px 20px; color: var(--ink-faint); }

/* ---------- Footer ---------- */
.app-footer { text-align: center; color: var(--ink-faint); font-size: 12.5px; padding: 24px 20px 36px; }

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .hero { padding: 28px 22px; border-radius: 16px; }
  .hero h1 { font-size: 25px; }
  .detail-card { padding: 20px; }
  .quiz-card { padding: 20px; }
  .result-hero { padding: 20px; }
  .topbar-inner { gap: 14px; }
}

/* ---------- Focus ---------- */
button:focus-visible, .chapter-row:focus-visible, .subject-card:focus-visible {
  outline: 2px solid var(--navy); outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
<div class="app-shell"><div id="app"></div></div>
<script>
// ============ DATA KURIKULUM (K13 + Kurikulum Merdeka, digabung) ============

const SUBJECT_META = {
  "Matematika": { color: "ipa", icon: "sigma" },
  "Fisika": { color: "ipa", icon: "atom" },
  "Kimia": { color: "ipa", icon: "flask" },
  "Biologi": { color: "ipa", icon: "leaf" },
  "Ekonomi": { color: "ips", icon: "coins" },
  "Sosiologi": { color: "ips", icon: "users" },
  "Geografi": { color: "ips", icon: "globe" },
  "Bahasa Indonesia": { color: "bahasa", icon: "book" },
  "Bahasa Inggris": { color: "bahasa", icon: "chat" },
  "Antropologi": { color: "bahasa", icon: "mask" }
};

// Setiap bab: title, ringkasan materi (array paragraf singkat), metode (array 3 langkah), quiz (5 soal)
const CHAPTERS = [

// ================= KELAS 10 =================
{
  grade: 10, jurusan: "IPA", subject: "Matematika", title: "Eksponen dan Logaritma",
  materi: [
    "Eksponen (perpangkatan) menyatakan perkalian berulang: a pangkat n berarti a dikalikan sebanyak n kali. Sifat pentingnya: a^m x a^n = a^(m+n), (a^m)^n = a^(m x n), dan a^0 = 1 untuk a tidak sama dengan 0.",
    "Logaritma adalah kebalikan dari eksponen. Jika a^x = b, maka x = alog b, dengan a sebagai basis (a>0, a tidak sama dengan 1) dan b sebagai numerus (b>0).",
    "Sifat logaritma yang sering dipakai: alog(b x c) = alog b + alog c, alog(b/c) = alog b - alog c, dan alog(b^n) = n x alog b."
  ],
  metode: [
    "Hafalkan dulu sifat dasar eksponen dan logaritma sebelum mengerjakan soal campuran.",
    "Saat soal menggabungkan beberapa basis logaritma, ubah semua ke basis yang sama terlebih dahulu.",
    "Cek jawaban dengan mensubstitusi angka kecil (misalnya basis 2) untuk memastikan sifat yang dipakai benar."
  ],
  quiz: [
    { q: "Hasil dari 2^3 x 2^-1 adalah ...", options: ["2","4","8","1"], correct: 1, exp: "2^3 x 2^-1 = 2^(3-1) = 2^2 = 4." },
    { q: "Bentuk sederhana dari (3^2)^3 adalah ...", options: ["3^5","3^6","3^8","3^9"], correct: 1, exp: "(3^2)^3 = 3^(2x3) = 3^6." },
    { q: "Nilai dari 2log 8 adalah ...", options: ["2","3","4","8"], correct: 1, exp: "2^3 = 8, sehingga 2log 8 = 3." },
    { q: "Jika 5^x = 125, maka nilai x adalah ...", options: ["2","3","4","5"], correct: 1, exp: "125 = 5^3, sehingga x = 3." },
    { q: "alog b + alog c senilai dengan ...", options: ["alog(b-c)","alog(b x c)","alog(b/c)","alog(b+c)"], correct: 1, exp: "Sifat penjumlahan logaritma: alog b + alog c = alog(b x c)." }
  ]
},
{
  grade: 10, jurusan: "IPA", subject: "Fisika", title: "Besaran, Satuan, dan Pengukuran",
  materi: [
    "Besaran pokok adalah besaran yang satuannya ditetapkan lebih dulu, contohnya panjang (meter), massa (kilogram), dan waktu (sekon). Besaran turunan diperoleh dari kombinasi besaran pokok, misalnya kecepatan (m/s) dan luas (m^2).",
    "Pengukuran selalu memiliki ketidakpastian. Jangka sorong memiliki ketelitian 0,1 mm sedangkan mikrometer sekrup 0,01 mm, sehingga mikrometer sekrup lebih presisi untuk benda tipis.",
    "Angka penting adalah semua angka hasil pengukuran yang dapat dipercaya, termasuk satu angka taksiran terakhir. Aturan operasi angka penting mengikuti jumlah angka penting paling sedikit dari data yang dioperasikan."
  ],
  metode: [
    "Buat tabel besaran pokok beserta satuan dan alat ukurnya agar mudah diingat.",
    "Latih konversi satuan (misal cm ke m) sampai terbiasa tanpa kalkulator.",
    "Kerjakan soal pembacaan skala jangka sorong dan mikrometer dengan gambar, bukan hanya rumus."
  ],
  quiz: [
    { q: "Satuan SI untuk besaran massa adalah ...", options: ["gram","kilogram","newton","liter"], correct: 1, exp: "Satuan SI massa adalah kilogram (kg)." },
    { q: "Alat ukur panjang paling presisi untuk benda tipis seperti kertas adalah ...", options: ["penggaris","jangka sorong","mikrometer sekrup","meteran"], correct: 2, exp: "Mikrometer sekrup punya ketelitian 0,01 mm, paling presisi untuk benda tipis." },
    { q: "Kecepatan merupakan besaran turunan dari ...", options: ["panjang dan waktu","massa dan waktu","panjang dan massa","waktu saja"], correct: 0, exp: "Kecepatan = perpindahan (panjang) dibagi waktu." },
    { q: "Ketelitian jangka sorong adalah ...", options: ["0,1 mm","0,01 mm","1 mm","0,5 mm"], correct: 0, exp: "Jangka sorong memiliki ketelitian 0,1 mm." },
    { q: "Hasil 12,34 cm + 1,2 cm ditulis dengan aturan angka penting menjadi ...", options: ["13,5 cm","13,54 cm","13,6 cm","13,55 cm"], correct: 0, exp: "Hasil penjumlahan mengikuti angka penting yang paling sedikit desimalnya (satu angka di belakang koma), yaitu 13,5 cm." }
  ]
},
{
  grade: 10, jurusan: "IPA", subject: "Kimia", title: "Struktur Atom dan Sistem Periodik",
  materi: [
    "Atom tersusun atas proton (bermuatan positif) dan neutron di inti, serta elektron (bermuatan negatif) yang mengelilingi inti. Nomor atom menunjukkan jumlah proton, nomor massa menunjukkan jumlah proton ditambah neutron.",
    "Konfigurasi elektron menggambarkan susunan elektron pada kulit atom. Elektron valensi (elektron di kulit terluar) menentukan sifat kimia suatu unsur.",
    "Dalam sistem periodik, unsur disusun berdasarkan kenaikan nomor atom. Satu golongan (kolom) memiliki jumlah elektron valensi yang sama, satu periode (baris) memiliki jumlah kulit yang sama."
  ],
  metode: [
    "Hafalkan urutan pengisian kulit elektron (2, 8, 8, 18) sebagai dasar konfigurasi sederhana.",
    "Gunakan tabel periodik saat berlatih soal, jangan hanya menghafal tanpa memahami polanya.",
    "Kaitkan letak golongan dan periode dengan sifat unsur (logam, non-logam, jari-jari atom) supaya konsep lebih melekat."
  ],

// ============ STORAGE HELPERS ============
async function saveProgress(key, value) {
  try { await window.storage.set('progress:' + key, JSON.stringify(value), false); } catch (e) { console.error('save failed', e); }
}
async function getProgress(key) {
  try {
    const r = await window.storage.get('progress:' + key, false);
    return r ? JSON.parse(r.value) : null;
  } catch (e) { return null; }
}
async function listProgress() {
  try {
    const r = await window.storage.list('progress:', false);
    if (!r || !r.keys) return [];
    const out = [];
    for (const k of r.keys) {
      try {
        const v = await window.storage.get(k, false);
        if (v) out.push({ key: k.replace('progress:', ''), data: JSON.parse(v.value) });
      } catch (e) {}
    }
    return out;
  } catch (e) { return []; }
}
async function resetAllProgress() {
  try {
    const r = await window.storage.list('progress:', false);
    if (r && r.keys) {
      for (const k of r.keys) { try { await window.storage.delete(k, false); } catch (e) {} }
    }
  } catch (e) {}
}

function chapterKey(ch) { return ch.grade + '-' + ch.jurusan + '-' + slug(ch.subject) + '-' + slug(ch.title); }
function utbkKey(section) { return 'utbk-' + section.key; }
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  '<div class="hero">' +

    '<h1>Semua materi kurikulum, dirangkum singkat dan mudah dimengerti.</h1>' +
    '<p>Materi disusun dari Kurikulum 2013 dan Kurikulum Merdeka yang digabung jadi satu, lengkap dengan cara belajar cepat dan tryout di setiap bab, plus persiapan UTBK-SNBT terbaru.</p>' +
    '<div class="hero-actions">' +
      '<button class="btn btn-primary" data-nav="materi">' + icon('compass', 16) + ' Mulai belajar</button>' +
      '<button class="btn btn-ghost" data-nav="utbk">' + icon('target', 16) + ' Latihan UTBK</button>' +
    '</div>' +
    '<div class="stat-strip">' +
      '<div class="stat-item"><div class="stat-num">' + totalDone + '/30</div><div class="stat-label">bab tryout selesai</div></div>' +
      '<div class="stat-item"><div class="stat-num">' + (chapterProgress.length ? avgScore + '%' : '-') + '</div><div class="stat-label">rata-rata skor</div></div>' +
      '<div class="stat-item"><div class="stat-num">' + utbkProgress.length + '/4</div><div class="stat-label">subtes UTBK dicoba</div></div>' +
    '</div>' +
  '</div>' +

  '<div class="section-head"><h2>Pilih jurusan</h2><span class="hint">Kelas 10, 11, dan 12</span></div>' +
  '<div class="subject-grid">' +
    JURUSAN.map(j => '' +
      '<button class="subject-card" data-jurusan-home="' + j + '">' +
        '<div class="subject-icon ' + JURUSAN_TAG[j] + '">' + icon(j === 'IPA' ? 'atom' : j === 'IPS' ? 'coins' : 'book', 20) + '</div>' +
        '<h3>' + j + '</h3>' +
        '<div class="meta">' + subjectNamesFor(j) + '</div>' +
      '</button>'
    ).join('') +
  '</div>' +

  '<div class="section-head"><h2>Persiapan UTBK-SNBT & TKA</h2><span class="hint">Terbaru mengikuti jadwal SNPMB 2026</span></div>' +
  '<div class="utbk-card-grid">' +
    UTBK_SECTIONS.slice(0, 2).map(s => '' +
      '<div class="utbk-card">' +
        '<h3>' + s.title + '</h3>' +
        '<p>' + s.materi[0].slice(0, 92) + '...</p>' +
        '<button class="btn btn-outline" data-utbk-open="' + s.key + '">Lihat materi</button>' +
      '</div>'
    ).join('') +
  '</div>';

  el.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav === 'materi' ? 'materi' : b.dataset.nav)));
  el.querySelectorAll('[data-jurusan-home]').forEach(b => b.addEventListener('click', () => go('subjects', { jurusan: b.dataset.jurusanHome, grade: state.grade })));
  el.querySelectorAll('[data-utbk-open]').forEach(b => b.addEventListener('click', () => {
    const sec = UTBK_SECTIONS.find(s => s.key === b.dataset.utbkOpen);
    go('utbkDetail', { utbkSection: sec });
  }));
}

function subjectNamesFor(j) {
  const names = {};
  CHAPTERS.forEach(c => { if (c.jurusan === j) names[c.subject] = true; });
  return Object.keys(names).join(', ');
}

// ============ RENDER: MATERI (pilih kelas & jurusan) -> redirect to subjects ============
function renderMateri() {
  go('subjects', {});
}

// ============ RENDER: SUBJECTS (per kelas/jurusan) ============
async function renderSubjects() {
  root.innerHTML = renderTopbar() + '<div class="container" id="sub-root"></div>' + renderFooter();
  bindTopnav();
  const el = document.getElementById('sub-root');

  const subjectsInScope = {};
  CHAPTERS.filter(c => c.grade === state.grade && c.jurusan === state.jurusan).forEach(c => {
    if (!subjectsInScope[c.subject]) subjectsInScope[c.subject] = [];
    subjectsInScope[c.subject].push(c);
  });

  el.innerHTML = '' +
  '<div class="crumbrow"><span class="crumb-text">Materi SMA <b>&rsaquo; Kelas ' + state.grade + ' &rsaquo; ' + state.jurusan + '</b></span></div>' +
  '<div class="section-head"><h2>Pilih kelas</h2></div>' +
  '<div class="chip-row">' + GRADES.map(g => '<button class="chip ' + (g === state.grade ? 'active' : '') + '" data-grade="' + g + '">Kelas ' + g + '</button>').join('') + '</div>' +
  '<div class="section-head" style="margin-top:20px;"><h2>Pilih jurusan</h2></div>' +
  '<div class="chip-row">' + JURUSAN.map(j => '<button class="chip ' + (j === state.jurusan ? 'active' : '') + '" data-jurusan="' + j + '">' + j + '</button>').join('') + '</div>' +

  '<div class="section-head"><h2>Mata pelajaran</h2><span class="hint">' + Object.keys(subjectsInScope).length + ' mapel tersedia</span></div>' +
  '<div class="subject-grid">' +
    Object.keys(subjectsInScope).map(subj => {
      const meta = SUBJECT_META[subj] || { color: 'ipa', icon: 'book' };
      const chapters = subjectsInScope[subj];
      return '' +
      '<button class="subject-card" data-subject="' + encodeURIComponent(subj) + '">' +
        '<div class="subject-icon tag-' + meta.color + '">' + icon(meta.icon, 20) + '</div>' +
        '<h3>' + subj + '</h3>' +
        '<div class="meta">' + chapters.length + ' bab tersedia</div>' +
      '</button>';
    }).join('') +
  '</div>';

  el.querySelectorAll('[data-grade]').forEach(b => b.addEventListener('click', () => go('subjects', { grade: parseInt(b.dataset.grade, 10) })));
  el.querySelectorAll('[data-jurusan]').forEach(b => b.addEventListener('click', () => go('subjects', { jurusan: b.dataset.jurusan })));
  el.querySelectorAll('[data-subject]').forEach(b => b.addEventListener('click', () => go('chapters', { subject: decodeURIComponent(b.dataset.subject) })));
}

// ============ RENDER: CHAPTERS LIST ============
async function renderChapters() {
  root.innerHTML = renderTopbar() + '<div class="container" id="ch-root"></div>' + renderFooter();
  bindTopnav();
  const el = document.getElementById('ch-root');

  const chapters = CHAPTERS.filter(c => c.grade === state.grade && c.jurusan === state.jurusan && c.subject === state.subject);
  const meta = SUBJECT_META[state.subject] || { color: 'ipa', icon: 'book' };

  el.innerHTML = '' +
  '<div class="crumbrow"><button class="back-btn" data-back="subjects">' + icon('arrowLeft', 15) + ' Mapel</button>' +
    '<span class="crumb-text">Kelas ' + state.grade + ' &rsaquo; ' + state.jurusan + ' &rsaquo; <b>' + state.subject + '</b></span></div>' +
  '<div class="section-head"><h2>' + state.subject + '</h2><span class="hint">Kelas ' + state.grade + '</span></div>' +
  '<div class="chapter-list" id="ch-list">' +
    chapters.map((c, i) => '' +
      '<div class="chapter-row" data-idx="' + i + '" style="cursor:pointer;">' +
        '<div class="chapter-num tag-' + meta.color + '">' + (i + 1) + '</div>' +
        '<div class="body"><h4>' + c.title + '</h4><div class="sub">Materi ringkas + metode belajar + tryout 5 soal</div></div>' +
        '<div class="score-slot" data-slot="' + chapterKey(c) + '"><span class="badge badge-todo">Belum dicoba</span></div>' +
      '</div>'
    ).join('') +
  '</div>';

  el.querySelector('[data-back]').addEventListener('click', () => go('subjects'));
  el.querySelectorAll('.chapter-row').forEach(row => row.addEventListener('click', () => go('chapter', { chapter: chapters[parseInt(row.dataset.idx, 10)] })));

  // fill in progress badges
  for (const c of chapters) {
    const p = await getProgress(chapterKey(c));
    const slot = el.querySelector('[data-slot="' + chapterKey(c) + '"]');
    if (slot && p) {
      const pct = Math.round((p.score / p.total) * 100);
      slot.innerHTML = '<span class="badge badge-good">' + icon('check', 11) + ' ' + pct + '%</span>';
    }
  }
}

// ============ RENDER: CHAPTER DETAIL ============
function renderChapterDetail() {
  const c = state.chapter;
  const meta = SUBJECT_META[c.subject] || { color: 'ipa', icon: 'book' };
  root.innerHTML = renderTopbar() + '<div class="container narrow">' +
    '<div class="crumbrow"><button class="back-btn" data-back="1">' + icon('arrowLeft', 15) + ' ' + c.subject + '</button></div>' +
    '<div class="detail-card">' +
      '<div class="detail-header"><div><span class="detail-tag tag-' + meta.color + '">' + c.subject + ' &middot; Kelas ' + c.grade + '</span><h1>' + c.title + '</h1></div></div>' +
      '<div class="materi-block" style="margin-top:16px;">' + c.materi.map(p => '<p>' + p + '</p>').join('') + '</div>' +
      '<div class="method-box"><h3>' + icon('flame', 16) + ' Cara belajar cepat bab ini</h3>' +
        '<ol class="method-steps">' + c.metode.map((m, i) => '<li><span class="num">' + (i + 1) + '</span><span>' + m + '</span></li>').join('') + '</ol>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<button class="btn btn-primary btn-block" id="start-quiz">' + icon('target', 16) + ' Mulai tryout (5 soal)</button>' +
    '</div>' +
  '</div>' + renderFooter();
  bindTopnav();
  document.querySelector('[data-back]').addEventListener('click', () => go('chapters'));
  document.getElementById('start-quiz').addEventListener('click', () => go('quiz', { quizIdx: 0, quizAnswers: new Array(c.quiz.length).fill(null) }));
}

// ============ RENDER: QUIZ (chapter tryout) ============
function renderQuiz() {
  const c = state.chapter;
  renderQuizGeneric(c.quiz, state.quizIdx, state.quizAnswers, c.subject + ' &middot; ' + c.title, function onAnswer(i) {
    state.quizAnswers[state.quizIdx] = i; render();
  }, function onNext() {
    if (state.quizIdx < c.quiz.length - 1) { state.quizIdx++; render(); }
    else go('result');
  }, function onPrev() {
    if (state.quizIdx > 0) { state.quizIdx--; render(); }
  }, function onBack() { go('chapter'); });
}

function renderQuizGeneric(quiz, idx, answers, headerLabel, onAnswer, onNext, onPrev, onBack) {
  const q = quiz[idx];
  const letters = ['A', 'B', 'C', 'D'];
  root.innerHTML = renderTopbar() + '<div class="container narrow">' +
    '<div class="crumbrow"><button class="back-btn" data-back="1">' + icon('arrowLeft', 15) + ' Keluar tryout</button></div>' +
    '<div class="quiz-progress">' + quiz.map((_, i) => '<div class="quiz-dot ' + (i < idx ? 'done' : i === idx ? 'current' : '') + '"></div>').join('') + '</div>' +
    '<div class="quiz-card">' +
      '<div class="quiz-meta">' + headerLabel + ' &middot; Soal ' + (idx + 1) + ' dari ' + quiz.length + '</div>' +
      '<div class="quiz-question">' + q.q + '</div>' +
      '<div class="quiz-options">' +
        q.options.map((opt, i) => '<button class="quiz-option ' + (answers[idx] === i ? 'selected' : '') + '" data-opt="' + i + '"><span class="opt-letter">' + letters[i] + '</span><span>' + opt + '</span></button>').join('') +
      '</div>' +
      '<div class="quiz-nav">' +
        '<button class="btn btn-outline" id="quiz-prev" ' + (idx === 0 ? 'disabled' : '') + '>Sebelumnya</button>' +
        '<button class="btn btn-primary" id="quiz-next" ' + (answers[idx] === null ? 'disabled' : '') + '>' + (idx === quiz.length - 1 ? 'Selesai & lihat hasil' : 'Selanjutnya') + '</button>' +
      '</div>' +
    '</div>' +
  '</div>' + renderFooter();
  bindTopnav();
  document.querySelector('[data-back]').addEventListener('click', onBack);
  document.querySelectorAll('.quiz-option').forEach(b => b.addEventListener('click', () => onAnswer(parseInt(b.dataset.opt, 10))));
  document.getElementById('quiz-next').addEventListener('click', onNext);
  document.getElementById('quiz-prev').addEventListener('click', onPrev);
}

// ============ RENDER: RESULT (chapter tryout) ============
async function renderResult() {
  const c = state.chapter;
  const answers = state.quizAnswers;
  let score = 0;
  c.quiz.forEach((q, i) => { if (answers[i] === q.correct) score++; });
  const total = c.quiz.length;
  await saveProgress(chapterKey(c), { score, total, date: Date.now(), title: c.title });
  renderResultGeneric(c.quiz, answers, score, total, c.subject + ' &middot; ' + c.title, function retry() {
    go('quiz', { quizIdx: 0, quizAnswers: new Array(c.quiz.length).fill(null) });
  }, function backToChapter() { go('chapter'); });
}

function renderResultGeneric(quiz, answers, score, total, headerLabel, onRetry, onBack) {
  const pct = Math.round((score / total) * 100);
  const ringColor = pct >= 70 ? 'var(--good)' : pct >= 40 ? 'var(--ips)' : 'var(--bad)';
  const letters = ['A', 'B', 'C', 'D'];
  root.innerHTML = renderTopbar() + '<div class="container narrow">' +
    '<div class="crumbrow"><button class="back-btn" data-back="1">' + icon('arrowLeft', 15) + ' Kembali</button></div>' +
    '<div class="result-hero">' +
      '<div class="score-ring" style="background:' + ringColor + '">' + pct + '%</div>' +
      '<div class="result-copy"><h2>Skor kamu: ' + score + ' dari ' + total + '</h2><p>' + headerLabel + '</p></div>' +
    '</div>' +
    '<div class="section-head" style="margin-top:0;"><h2>Pembahasan</h2></div>' +
    quiz.map((q, i) => {
      const userAns = answers[i];
      const correct = userAns === q.correct;
      return '<div class="review-item">' +
        '<div class="review-q">' + (i + 1) + '. ' + q.q + '</div>' +
        '<div class="review-line"><span class="lab">Jawabanmu</span><span class="' + (correct ? 'review-good' : 'review-bad') + '">' + (userAns === null || userAns === undefined ? 'Tidak dijawab' : letters[userAns] + '. ' + q.options[userAns]) + '</span></div>' +
        (correct ? '' : '<div class="review-line"><span class="lab">Jawaban benar</span><span class="review-good">' + letters[q.correct] + '. ' + q.options[q.correct] + '</span></div>') +
        '<div class="review-exp">' + q.exp + '</div>' +
      '</div>';
    }).join('') +
    '<div style="display:flex; gap:10px; margin-top:20px;">' +
      '<button class="btn btn-outline" id="retry-btn">' + icon('refresh', 15) + ' Coba lagi</button>' +
      '<button class="btn btn-primary" id="back-btn2">Selesai</button>' +
    '</div>' +
  '</div>' + renderFooter();
  bindTopnav();
  document.querySelector('[data-back]').addEventListener('click', onBack);
  document.getElementById('retry-btn').addEventListener('click', onRetry);
  document.getElementById('back-btn2').addEventListener('click', onBack);
}

// ============ RENDER: UTBK OVERVIEW ============
function renderUTBK() {
  root.innerHTML = renderTopbar() + '<div class="container" id="utbk-root"></div>' + renderFooter();
  bindTopnav();
  const el = document.getElementById('utbk-root');
  el.innerHTML = '' +
  '<div class="utbk-banner">' +
    '<h1>Persiapan UTBK-SNBT & info TKA terbaru</h1>' +
    '<p>' + UTBK_INFO.updated + ' Struktur tes dibagi tiga komponen: Tes Potensi Skolastik, Tes Literasi, dan Penalaran Matematika, dengan total durasi 195 menit.</p>' +
    '<div class="info-note">' + UTBK_INFO.note + '</div>' +
  '</div>' +
  '<div class="section-head"><h2>Materi & tryout per subtes</h2><span class="hint">4 subtes tersedia</span></div>' +
  '<div class="chapter-list">' +
    UTBK_SECTIONS.map((s, i) => '' +
      '<div class="chapter-row" data-uidx="' + i + '" style="cursor:pointer;">' +
        '<div class="chapter-num" style="background:var(--accent-soft); color:var(--accent);">' + (i + 1) + '</div>' +
        '<div class="body"><h4>' + s.title + '</h4><div class="sub">Materi ringkas + metode + tryout 5 soal</div></div>' +
        '<div class="score-slot" data-slot="' + utbkKey(s) + '"><span class="badge badge-todo">Belum dicoba</span></div>' +
      '</div>'
    ).join('') +
  '</div>';
  el.querySelectorAll('.chapter-row').forEach(row => row.addEventListener('click', () => go('utbkDetail', { utbkSection: UTBK_SECTIONS[parseInt(row.dataset.uidx, 10)] })));

  (async () => {
    for (const s of UTBK_SECTIONS) {
      const p = await getProgress(utbkKey(s));
      const slot = el.querySelector('[data-slot="' + utbkKey(s) + '"]');
      if (slot && p) {
        const pct = Math.round((p.score / p.total) * 100);
        slot.innerHTML = '<span class="badge badge-good">' + icon('check', 11) + ' ' + pct + '%</span>';
      }
    }
  })();
}

// ============ RENDER: UTBK DETAIL ============
function renderUTBKDetail() {
  const s = state.utbkSection;
  root.innerHTML = renderTopbar() + '<div class="container narrow">' +
    '<div class="crumbrow"><button class="back-btn" data-back="1">' + icon('arrowLeft', 15) + ' UTBK & TKA</button></div>' +
    '<div class="detail-card">' +
      '<div class="detail-header"><div><span class="detail-tag" style="background:var(--accent-soft); color:var(--accent);">UTBK-SNBT</span><h1>' + s.title + '</h1></div></div>' +
      '<div class="materi-block" style="margin-top:16px;">' + s.materi.map(p => '<p>' + p + '</p>').join('') + '</div>' +
      '<div class="method-box"><h3>' + icon('flame', 16) + ' Cara belajar cepat subtes ini</h3>' +
        '<ol class="method-steps">' + s.metode.map((m, i) => '<li><span class="num">' + (i + 1) + '</span><span>' + m + '</span></li>').join('') + '</ol>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<button class="btn btn-primary btn-block" id="start-quiz">' + icon('target', 16) + ' Mulai tryout (5 soal)</button>' +
    '</div>' +
  '</div>' + renderFooter();
  bindTopnav();
  document.querySelector('[data-back]').addEventListener('click', () => go('utbk'));
  document.getElementById('start-quiz').addEventListener('click', () => go('utbkQuiz', { quizIdx: 0, quizAnswers: new Array(s.quiz.length).fill(null) }));
}

// ============ RENDER: UTBK QUIZ ============
function renderUTBKQuiz() {
  const s = state.utbkSection;
  renderQuizGeneric(s.quiz, state.quizIdx, state.quizAnswers, s.title, function onAnswer(i) {
    state.quizAnswers[state.quizIdx] = i; render();
  }, function onNext() {
    if (state.quizIdx < s.quiz.length - 1) { state.quizIdx++; render(); }
    else go('utbkResult');
  }, function onPrev() {
    if (state.quizIdx > 0) { state.quizIdx--; render(); }
  }, function onBack() { go('utbkDetail'); });
}

async function renderUTBKResult() {
  const s = state.utbkSection;
  const answers = state.quizAnswers;
  let score = 0;
  s.quiz.forEach((q, i) => { if (answers[i] === q.correct) score++; });
  const total = s.quiz.length;
  await saveProgress(utbkKey(s), { score, total, date: Date.now(), title: s.title });
  renderResultGeneric(s.quiz, answers, score, total, s.title, function retry() {
    go('utbkQuiz', { quizIdx: 0, quizAnswers: new Array(s.quiz.length).fill(null) });
  }, function backToChapter() { go('utbkDetail'); });
}

// ============ RENDER: PROGRES ============
async function renderProgres() {
  root.innerHTML = renderTopbar() + '<div class="container narrow" id="prog-root"><div class="empty-state">Memuat progres...</div></div>' + renderFooter();
  bindTopnav();
  const list = await listProgress();
  const el = document.getElementById('prog-root');

  if (!list.length) {
    el.innerHTML = '<div class="section-head"><h2>Progres belajar</h2></div>' +
      '<div class="empty-state">Belum ada tryout yang dikerjakan.<br>Mulai dari materi SMA atau UTBK untuk melihat progresmu di sini.</div>';
    return;
  }

  list.sort((a, b) => b.data.date - a.data.date);
  el.innerHTML = '' +
    '<div class="section-head"><h2>Progres belajar</h2><span class="hint">' + list.length + ' tryout dikerjakan</span></div>' +
    '<div class="chapter-list">' +
      list.map(p => {
        const pct = Math.round((p.data.score / p.data.total) * 100);
        const isUtbk = p.key.startsWith('utbk-');
        return '<div class="chapter-row" style="cursor:default;">' +
          '<div class="chapter-num" style="background:var(--paper); color:var(--ink-soft);">' + (isUtbk ? icon('target', 15) : icon('book', 15)) + '</div>' +
          '<div class="body"><h4>' + p.data.title + '</h4><div class="sub">' + (isUtbk ? 'UTBK-SNBT' : 'Tryout bab') + ' &middot; ' + new Date(p.data.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + '</div></div>' +
          '<span class="badge ' + (pct >= 60 ? 'badge-good' : 'badge-todo') + '">' + p.data.score + '/' + p.data.total + '</span>' +
        '</div>';
      }).join('') +
    '</div>' +
    '<div style="margin-top:20px;"><button class="btn btn-outline" id="reset-btn">' + icon('refresh', 15) + ' Reset semua progres</button></div>';

  document.getElementById('reset-btn').addEventListener('click', async () => {
    if (confirm('Yakin ingin menghapus semua progres tryout? Tindakan ini tidak bisa dibatalkan.')) {
      await resetAllProgress();
      render();
    }
  });
}

// ============ FOOTER ============
function renderFooter() {
  return '<div class="app-footer">Pintaru &middot; materi dirangkum dari Kurikulum 2013 dan Kurikulum Merdeka untuk kelas 10-12 SMA</div>';
}

// ============ NAV BINDING ============
function bindTopnav() {
  document.querySelectorAll('.topnav-btn').forEach(b => {
    b.addEventListener('click', () => {
      const v = b.dataset.nav;
      if (v === 'materi') go('subjects');
      else if (v === 'utbk') go('utbk');
      else if (v === 'progres') go('progres');
      else go('home');
    });
  });
}

// ============ MAIN RENDER DISPATCH ============
function render() {
  if (state.view === 'home') return renderHome();
  if (state.view === 'materi') return renderMateri();
  if (state.view === 'subjects') return renderSubjects();
  if (state.view === 'chapters') return renderChapters();
  if (state.view === 'chapter') return renderChapterDetail();
  if (state.view === 'quiz') return renderQuiz();
  if (state.view === 'result') return renderResult();
  if (state.view === 'utbk') return renderUTBK();
  if (state.view === 'utbkDetail') return renderUTBKDetail();
  if (state.view === 'utbkQuiz') return renderUTBKQuiz();
  if (state.view === 'utbkResult') return renderUTBKResult();
  if (state.view === 'progres') return renderProgres();
  return renderHome();
}

render();

</script>
